<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mouse Star Trail</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #050510;
      overflow: hidden;
      height: 100vh;
      cursor: crosshair;
    }

    .star {
      position: fixed;
      pointer-events: none;
      color: white;
      font-size: 14px;
      transform: translate(-50%, -50%);
      animation: fade 800ms ease-out forwards;
      text-shadow:
        0 0 5px white,
        0 0 10px #9bdcff,
        0 0 20px #4db8ff;
    }

    @keyframes fade {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2)
                   rotate(180deg);
      }
    }
  </style>
</head>

<body>

<script>
  document.addEventListener("mousemove", (event) => {
    const star = document.createElement("div");

    star.className = "star";
    star.textContent = "✦";

    // Put the star where the mouse is
    star.style.left = event.clientX + "px";
    star.style.top = event.clientY + "px";

    // Random size
    const size = Math.random() * 15 + 8;
    star.style.fontSize = size + "px";

    // Slightly random color
    const colors = [
      "#ffffff",
      "#9bdcff",
      "#74c7ff",
      "#d9b3ff",
      "#ffe9a8"
    ];

    star.style.color =
      colors[Math.floor(Math.random() * colors.length)];

    document.body.appendChild(star);

    // Remove it after animation
    setTimeout(() => {
      star.remove();
    }, 800);
  });
</script>

</body>
</html>

